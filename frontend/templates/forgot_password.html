<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Forgot Password | AI Heart Disease Detector</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1e293b, #020617);
      color: white;
    }

    /* ================= HEADER ================= */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 600;
    }

    .heart {
      font-size: 26px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.2)
      }

      100% {
        transform: scale(1)
      }
    }

    .back {
      color: #93c5fd;
      text-decoration: none;
      font-size: 14px;
    }

    /* ================= CONTAINER ================= */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 380px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .15);
      box-shadow: 0 0 40px rgba(59, 130, 246, .25);
    }

    /* ================= FLASH ================= */
    .flash {
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: center;
      animation: fade 0.3s ease-in;
    }

    .flash.success {
      background: rgba(34, 197, 94, .15);
      border: 1px solid #22c55e;
      color: #22c55e;
    }

    .flash.error {
      background: rgba(239, 68, 68, .15);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(-8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* ================= FORM ================= */
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: transparent;
      color: white;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, .6);
    }

    button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      box-shadow: 0 0 18px rgba(59, 130, 246, .8);
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="brand">
      <div class="heart">❤️</div>
      AI Heart Disease Detector
    </div>
    <a href="/login" class="back">← Back to Login</a>
  </div>

  <!-- CARD -->
  <div class="container">
    <div class="card">

      <!-- FLASH MESSAGES -->
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
      <div class="flash {{ category }}">
        {{ msg }}
      </div>
      {% endfor %}
      {% endwith %}

      <h2>Reset Password</h2>

      <form method="post" action="{{ url_for('forgot_password') }}">
        <input type="email" name="email" placeholder="Enter registered email or phone" required>
        <input type="password" name="new_password" placeholder="Enter new password" required>
        <button type="submit">Update Password</button>
      </form>

    </div>
  </div>

  <script>
    /* Auto-hide flash messages */
    setTimeout(() => {
      document.querySelectorAll(".flash").forEach(f => {
        f.style.opacity = "0";
        setTimeout(() => f.remove(), 400);
      });
    }, 3000);
  </script>

</body>

</html>
