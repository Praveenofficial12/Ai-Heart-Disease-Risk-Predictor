<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Medical Report</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:white;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 50px;
}

.site-name{
  font-size:20px;
  font-weight:600;
}

/* BUTTONS */
.header-actions a{
  text-decoration:none;
  margin-left:12px;
  padding:10px 22px;
  border-radius:25px;
  font-size:14px;
  transition:.3s;
}

.back-btn{
  border:1px solid #38bdf8;
  color:#38bdf8;
}

.back-btn:hover{
  background:#38bdf8;
  color:#020617;
  box-shadow:0 0 15px rgba(56,189,248,.6);
}

.logout-btn{
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:white;
}

.logout-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(239,68,68,.7);
}

/* LOGO */
.logo{
  text-align:center;
  margin:20px 0;
  font-size:52px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

/* CARD */
.card{
  max-width:520px;
  margin:30px auto;
  padding:40px;
  background:rgba(255,255,255,.06);
  border-radius:25px;
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
  text-align:center;
}

.card h2{
  margin-bottom:25px;
}

/* FILE INPUT */
input[type="file"]{
  width:100%;
  padding:16px;
  border-radius:16px;
  border:1px dashed rgba(255,255,255,.3);
  background:rgba(255,255,255,.08);
  color:white;
  cursor:pointer;
}

input[type="file"]::file-selector-button{
  padding:10px 20px;
  border-radius:20px;
  border:none;
  background:#38bdf8;
  color:#020617;
  cursor:pointer;
}

/* SUBMIT */
button{
  margin-top:25px;
  padding:14px 50px;
  border-radius:30px;
  border:none;
  background:linear-gradient(135deg,#06b6d4,#3b82f6);
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px rgba(59,130,246,.7);
}

.note{
  font-size:13px;
  color:#94a3b8;
  margin-top:15px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="site-name">AI Heart Disease Risk Predictor</div>

  <div class="header-actions">
    <a href="/dashboard" class="back-btn">← Dashboard</a>
    <a href="#" class="logout-btn" onclick="confirmLogout()">Sign Out</a>
  </div>
</div>

<!-- LOGO -->
<div class="logo">❤️</div>

<!-- CARD -->
<div class="card">
  <h2>Upload Medical Report</h2>

  <form action="/upload-report" method="post" enctype="multipart/form-data">
    <input 
      type="file" 
      name="report"
      accept=".pdf,.jpg,.jpeg,.png"
      required
    >
    <button type="submit">Upload Report</button>
  </form>

  <div class="note">
    Allowed formats: PDF, JPG, JPEG, PNG
  </div>
</div>

<script src="/static/js/main.js"></script>

<script>
function confirmLogout(){
  if(confirm("Are you sure you want to sign out?")){
    window.location.href="/logout";
  }
}
</script>

</body>
</html>
