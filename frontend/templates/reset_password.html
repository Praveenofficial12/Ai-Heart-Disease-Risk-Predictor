<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | CardioAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(14, 165, 233, 0.08) 0%, transparent 60%);
    }

    .auth-wrap {
      width: 100%;
      max-width: 440px;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--clr-text);
      justify-content: center;
      margin-bottom: 36px;
    }

    .auth-logo-icon {
      width: 42px;
      height: 42px;
      background: var(--gradient-primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .auth-logo-text {
      font-size: 18px;
      font-weight: 700;
    }

    .auth-card {
      background: var(--clr-card);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .auth-card-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(59, 130, 246, 0.1));
      border: 2px solid rgba(14, 165, 233, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 20px;
    }

    .auth-card-title {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-card-sub {
      text-align: center;
      color: var(--clr-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .strength-bar {
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      border-radius: var(--radius-full);
      transition: all 0.35s ease;
    }

    .strength-text {
      font-size: 12px;
      color: var(--clr-muted);
      margin-bottom: 18px;
    }

    .btn-full {
      width: 100%;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 16px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--clr-primary);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="auth-wrap anim-fade-up">
    <a href="/" class="auth-logo">
      <div class="auth-logo-icon heartbeat">❤️</div>
      <span class="auth-logo-text">CardioAI</span>
    </a>

    <div class="auth-card">
      <div class="auth-card-icon">🔐</div>
      <h1 class="auth-card-title">Set New Password</h1>
      <p class="auth-card-sub">Create a strong new password for your CardioAI account</p>

      <form method="post">

        <div class="form-group">
          <label class="form-label">New Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" class="form-control" placeholder="New password"
              required oninput="checkStrength()">
            <span class="eye-toggle" onclick="togglePwd('password', this)">👁️</span>
          </div>
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-text" id="strengthText">Password strength</div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input type="password" id="confirm" name="confirm" class="form-control" placeholder="Confirm password"
              required>
            <span class="eye-toggle" onclick="togglePwd('confirm', this)">👁️</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Update Password</button>
      </form>

      <a href="{{ url_for('login') }}" class="back-link">← Back to Sign In</a>
    </div>
  </div>

  <script>
    function togglePwd(id, el) {
      const f = document.getElementById(id);
      f.type = f.type === 'password' ? 'text' : 'password';
      el.textContent = f.type === 'password' ? '👁️' : '🙈';
    }

    function checkStrength() {
      const v = document.getElementById('password').value;
      const f = document.getElementById('strengthFill');
      const t = document.getElementById('strengthText');
      let s = 0;
      if (v.length >= 8) s++;
      if (/[A-Z]/.test(v)) s++;
      if (/\d/.test(v)) s++;
      if (/\W/.test(v)) s++;
      const map = [
        ['0%', '', 'Password strength'],
        ['25%', '#dc2626', 'Weak'],
        ['50%', '#f97316', 'Fair'],
        ['75%', '#f59e0b', 'Good'],
        ['100%', '#22c55e', '✓ Strong']
      ];
      f.style.width = map[s][0];
      f.style.background = map[s][1];
      t.textContent = map[s][2];
      t.style.color = map[s][1] || 'var(--clr-muted)';
    }
  </script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
