<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password | AI Heart Disease Detector</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", sans-serif;
}

body{
  min-height:100vh;
  background:radial-gradient(circle at top left,#1e293b,#020617);
  color:white;
}

/* ================= HEADER ================= */
.header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:25px;
}

.heart{
  font-size:34px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

.site-name{
  font-size:22px;
  font-weight:600;
}

/* ================= CARD ================= */
.container{
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:380px;
  padding:40px;
  background:rgba(255,255,255,0.08);
  border-radius:22px;
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 40px rgba(59,130,246,.25);
}

h2{
  text-align:center;
  margin-bottom:25px;
}

/* ================= INPUT ================= */
.field{
  position:relative;
  margin-bottom:18px;
}

.field input{
  width:100%;
  height:50px;
  padding:14px 44px 14px 16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.25);
  background:transparent;
  color:white;
  outline:none;
}

.field input:focus{
  border-color:#3b82f6;
  box-shadow:0 0 12px rgba(59,130,246,.6);
}

.eye{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

/* ================= STRENGTH BAR ================= */
.strength-bar{
  height:10px;
  background:#020617;
  border-radius:8px;
  overflow:hidden;
}

.strength-fill{
  height:100%;
  width:0%;
  transition:0.4s;
}

.strength-text{
  font-size:13px;
  margin-top:6px;
  margin-bottom:18px;
  color:#cbd5f5;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  height:50px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  box-shadow:0 0 18px rgba(59,130,246,.8);
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="heart">❤️</div>
  <div class="site-name">AI Heart Disease Detector</div>
</div>

<!-- CARD -->
<div class="container">
  <div class="card">

    <h2>Set New Password</h2>

    <form method="post">

      <div class="field">
        <input type="password" id="password" name="password" placeholder="New Password" required>
        <span class="eye" onclick="toggle('password',this)">👁️</span>
      </div>

      <div class="strength-bar">
        <div class="strength-fill" id="strengthFill"></div>
      </div>
      <div class="strength-text" id="strengthText">Password strength</div>

      <div class="field">
        <input type="password" id="confirm" name="confirm" placeholder="Confirm Password" required>
        <span class="eye" onclick="toggle('confirm',this)">👁️</span>
      </div>

      <button type="submit">Update Password</button>
    </form>

  </div>
</div>

<!-- ================= JS ================= -->
<script>
/* PASSWORD STRENGTH */
document.getElementById("password").addEventListener("input",e=>{
  const v=e.target.value;
  const f=document.getElementById("strengthFill");
  const t=document.getElementById("strengthText");
  let s=0;
  if(v.length>=8)s++;
  if(/[A-Z]/.test(v))s++;
  if(/\d/.test(v))s++;
  if(/\W/.test(v))s++;

  const map=[
    ["0%","","Password strength"],
    ["25%","#dc2626","Weak"],
    ["50%","#f97316","Medium"],
    ["75%","#facc15","Good"],
    ["100%","#22c55e","Strong"]
  ];

  f.style.width=map[s][0];
  f.style.background=map[s][1];
  t.textContent=map[s][2];
});

function toggle(id,e){
  const i=document.getElementById(id);
  i.type=i.type==="password"?"text":"password";
  e.textContent=i.type==="password"?"👁️":"🙈";
}
</script>

</body>
</html>
